<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test tokenu — Flota 2.0</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f3f0;color:#1b1a16;padding:1.2rem;line-height:1.5}
  @media (prefers-color-scheme:dark){body{background:#151412;color:#f1efe8}}
  h1{font-size:1.3rem;margin:0 0 .3rem}
  .sub{color:#77746a;font-size:.85rem;margin:0 0 1.4rem}
  .card{border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem;border:1px solid rgba(120,115,100,.3)}
  .status-ok{background:#e6f2ea;color:#1b6b35;border-color:#1b6b35}
  .status-bad{background:#f8e3e0;color:#a3271f;border-color:#a3271f}
  .status-info{background:#e3ecf3;color:#28577e;border-color:#28577e}
  @media (prefers-color-scheme:dark){
    .status-ok{background:#123321;color:#4bcf7f;border-color:#4bcf7f}
    .status-bad{background:#3a1712;color:#ff6b5e;border-color:#ff6b5e}
    .status-info{background:#132a3d;color:#79b0e0;border-color:#79b0e0}
  }
  .lbl{font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;font-family:ui-monospace,monospace;opacity:.75;display:block;margin-bottom:.35rem}
  .big{font-size:1.15rem;font-weight:700}
  code{font-family:ui-monospace,monospace;font-size:.85em;word-break:break-all}
  .steps{font-size:.9rem}
  .steps li{margin-bottom:.5rem}
  button{width:100%;padding:.85rem;border-radius:10px;border:none;background:#e30613;color:#fff;font-size:1rem;font-weight:600;margin-top:.4rem}
  button.secondary{background:transparent;border:1px solid rgba(120,115,100,.5);color:inherit}
  .footer-note{font-size:.75rem;color:#77746a;margin-top:1.6rem}
</style>
</head>
<body>
  <h1>Test przetrwania tokenu</h1>
  <p class="sub">Diagnostyczna strona testowa Flota 2.0 — sprawdza wyłącznie jedną rzecz: czy dane zapisane w localStorage po dodaniu do ekranu głównego przetrwają dłużej niż standardowy 7-dniowy limit ITP w Safari. Nic z tego nie łączy się z żadnym prawdziwym serwerem floty.</p>

  <div id="modeCard" class="card"></div>
  <div id="mainCard" class="card"></div>
  <div id="actions"></div>

  <p class="footer-note" id="log"></p>

<script>
(function(){
  const KEY = 'flota_test_token';
  const modeCard = document.getElementById('modeCard');
  const mainCard = document.getElementById('mainCard');
  const actions = document.getElementById('actions');
  const log = document.getElementById('log');

  function isStandalone(){
    return window.navigator.standalone === true ||
           window.matchMedia('(display-mode: standalone)').matches;
  }

  function randomToken(){
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleString('pl-PL', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  function daysBetween(iso){
    const then = new Date(iso).getTime();
    const now = Date.now();
    return ((now - then) / (1000*60*60*24)).toFixed(2);
  }

  const standalone = isStandalone();

  modeCard.className = 'card ' + (standalone ? 'status-ok' : 'status-bad');
  modeCard.innerHTML = '<span class="lbl">Wynik testu trybu (display-mode: standalone)</span>' +
    '<span class="big">' + (standalone ? 'TAK — tryb standalone' : 'NIE — zwykła karta przeglądarki') + '</span>';

  if (!standalone) {
    mainCard.className = 'card status-info';
    mainCard.innerHTML = '<span class="lbl">Co teraz zrobić</span>' +
      '<p class="steps"><ol>' +
      '<li>Stuknij ikonę <strong>Udostępnij</strong> na dole ekranu Safari.</li>' +
      '<li>Wybierz <strong>„Dodaj do ekranu głównego"</strong>.</li>' +
      '<li>Otwórz nowo dodaną ikonę z ekranu głównego (nie z Safari).</li>' +
      '</ol></p>' +
      '<p style="font-size:.85rem;margin:0">Dopóki widzisz „NIE" u góry, strona celowo nie zapisuje żadnego tokenu — to dokładnie to samo zachowanie, co w kroku 3 właściwego procesu rejestracji.</p>';
    return;
  }

  const existing = localStorage.getItem(KEY);

  if (!existing) {
    const token = randomToken();
    const now = new Date().toISOString();
    localStorage.setItem(KEY, JSON.stringify({token, savedAt: now}));
    mainCard.className = 'card status-ok';
    mainCard.innerHTML = '<span class="lbl">Nowy token zapisany</span>' +
      '<p style="margin:.2rem 0"><code>' + token + '</code></p>' +
      '<p style="font-size:.85rem;margin:.6rem 0 0">Zapisany: ' + fmtDate(now) + '</p>' +
      '<p style="font-size:.85rem;margin:.3rem 0 0"><strong>Teraz zamknij aplikację i nie otwieraj jej przez co najmniej 8 dni.</strong> Potem otwórz ponownie z tej samej ikony na ekranie głównym i sprawdź, czy ten sam token nadal tu jest.</p>';
  } else {
    const data = JSON.parse(existing);
    const days = daysBetween(data.savedAt);
    mainCard.className = 'card status-ok';
    mainCard.innerHTML = '<span class="lbl">Token przetrwał — wciąż tu jest</span>' +
      '<p style="margin:.2rem 0"><code>' + data.token + '</code></p>' +
      '<p style="font-size:.85rem;margin:.6rem 0 0">Zapisany: ' + fmtDate(data.savedAt) + '</p>' +
      '<p style="font-size:.85rem;margin:.3rem 0 0">Minęło: <strong>' + days + ' dni</strong></p>' +
      (days >= 7
        ? '<p style="font-size:.9rem;margin:.7rem 0 0;font-weight:700">≥ 7 dni i token nadal istnieje — to potwierdza zwolnienie z limitu ITP.</p>'
        : '<p style="font-size:.85rem;margin:.7rem 0 0">Jeszcze mniej niż 7 dni — wróć do tej ikony ponownie po tym terminie.</p>');

    const btn = document.createElement('button');
    btn.className = 'secondary';
    btn.textContent = 'Wyczyść i zacznij test od nowa';
    btn.onclick = function(){
      localStorage.removeItem(KEY);
      location.reload();
    };
    actions.appendChild(btn);
  }

  log.textContent = 'Adres: ' + location.href;
})();
</script>
</body>
</html>
